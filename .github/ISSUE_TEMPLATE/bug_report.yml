name: Bug report
description: Report reproducible incorrect behavior
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private prompts, or client data.
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Sanitized decision fields
      description: Include provider, scope, risk, profile, runtime model, reasoning, and warnings if available.
